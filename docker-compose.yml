services:
  learning-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 直接在此注入密钥，或把 .env 放到同目录由 Dockerfile COPY
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      DATABASE_URL: sqlite:///./learning_agent.db
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    restart: unless-stopped
