name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Reproduce (eval + adversarial + ablation)
        # 一条命令跑完三件事，失败即非零退出：
        #   常规评测 6 例、对抗评测 3 例（必须拒答）、防幻觉消融 4 组对照。
        # 报告带环境指纹（Python/平台/依赖版本/git commit），便于事后对照。
        run: python scripts/reproduce.py --skip-pytest

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: |
            eval/report_*.json
            eval/ablation_*.json
            eval/reproduce_report.json
          if-no-files-found: warn
