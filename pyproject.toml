[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning-agent"
version = "0.1.0"
description = "LangGraph + FastAPI 对话式学习画像与多智能体学习系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "docs*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 把 pytest 的临时目录固定在项目内：某些受限环境（企业安全策略 / 沙箱）
# 会拒绝清理系统临时目录下的 pytest-of-* 软链接，导致测试跑完后在 session
# 收尾阶段抛 PermissionError —— 结果全绿却拿到非零退出码。
# 固定到项目内既绕开这个环境坑，也让测试产物集中可见（已 gitignore）。
# 注意：basetemp 只能通过命令行/ addopts 指定，不能写成 ini 键。
addopts = "--basetemp=.pytest_tmp"